<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/fashionStore.scss" />
    <title>Fashion Store</title>
  </head>
  <body>
    <nav class="gnb">
      <a href="../">&larr; Back to list</a>
    </nav>
    <main>
      <div class="frame">
        <header class="header">
          <span class="header__btn">👈</span>
          <h1 class="header__title">My Cart</h1>
          <sapn class="header__btn">🛒</sapn>
        </header>
        <section class="total">
          <span class="total__price">$3550</span>
          <span class="total__subtitle">based on your 5 items</span>
        </section>
        <section class="items">
          <article class="item">
            <div class="item__info">
              <div class="item__info-col">
                <h2 class="item__title">Pop Temple Print T-Shirt</h2>
                <h3 class="item__subtitle">limited 2002</h3>
              </div>
              <div class="item__info-col">
                <span class="item__total-price">$1990</span>
                <div class="item__piece-price">$995 per piece</div>
              </div>
            </div>
            <div class="item__specs">
              <div class="spec">
                <span class="spec__title">SIZE</span>
                <div class="spec__value">48 - L</div>
              </div>
              <div class="spec">
                <span class="spec__title">QT</span>
                <div class="spec__value">2 pcs</div>
              </div>
            </div>
            <!-- <img src="https://source.unsplash.com/random" class="item__photo"> -->
            <img
              src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=3387&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              class="item__photo"
            />
          </article>
          <article class="item">
            <div class="item__info">
              <div class="item__info-col">
                <h2 class="item__title">Pop Temple Print T-Shirt</h2>
                <h3 class="item__subtitle">limited 2002</h3>
              </div>
              <div class="item__info-col">
                <span class="item__total-price">$1990</span>
                <div class="item__piece-price">$995 per piece</div>
              </div>
            </div>
            <div class="item__specs">
              <div class="spec">
                <span class="spec__title">Size</span>
                <div class="spec__value">48 - L</div>
              </div>
              <div class="spec">
                <span class="spec__title">QT</span>
                <div class="spec__value">2 pcs</div>
              </div>
            </div>
            <!-- <img src="https://source.unsplash.com/random" class="item__photo" /> -->
            <img
              src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=3387&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              class="item__photo"
            />
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
